mutation CreateQuery(
  $environmentId: BigInt!
  $metrics: [MetricInput!]
  $groupBy: [GroupByInput!]
  $where: [WhereInput!]
  $orderBy: [OrderByInput!]
  $limit: Int
  $savedQuery: String
) {
  createQuery(
    environmentId: $environmentId
    metrics: $metrics
    groupBy: $groupBy
    where: $where
    orderBy: $orderBy
    limit: $limit
    savedQuery: $savedQuery
  ) {
    queryId
  }
}
