query GetModelsWithPaths(
  $environmentId: BigInt!
  $after: String
  $first: Int
) {
  environment(id: $environmentId) {
    applied {
      models(after: $after, first: $first) {
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            uniqueId
            name
            filePath
            projectId
          }
        }
      }
    }
  }
}
